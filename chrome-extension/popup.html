<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 260px; padding: 16px; background: #0f172a; color: #e2e8f0; font: 13px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 15px; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #cbd5e1; margin-top: 8px; }
  .switch input { accent-color: #6366f1; width: 16px; height: 16px; margin: 0; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 14px; }
  button { background: #4f46e5; border: 0; color: #fff; border-radius: 8px; padding: 7px 12px; font: inherit; font-weight: 600; cursor: pointer; flex: none; }
  button:hover { background: #6366f1; }
  #status { color: #94a3b8; min-width: 0; }
  #status.ok { color: #34d399; } #status.bad { color: #fb7185; }
  #status a { color: #a5b4fc; }
  details { margin-top: 14px; padding-top: 10px; border-top: 1px solid #1e293b; color: #64748b; font-size: 12px; }
  summary { cursor: pointer; }
  input[type=url] { width: 100%; box-sizing: border-box; margin-top: 6px; background: #020617; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 6px 8px; font: inherit; }
  input[type=url]:focus { outline: none; border-color: #818cf8; }
</style>
</head>
<body>
  <h1><img src="icons/32.png" width="20" height="20" alt="">ATLAS Reader</h1>
  <label class="switch"><input id="enabled" type="checkbox"> On for all pages</label>
  <label class="switch"><input id="showScore" type="checkbox"> Show comprehensibility</label>
  <div class="row">
    <span id="status"></span>
    <button id="rescan">Rescan page</button>
  </div>
  <details>
    <summary>Server</summary>
    <input id="server" type="url" placeholder="https://sdp.jasem.dev">
  </details>
  <script src="popup.js"></script>
</body>
</html>
