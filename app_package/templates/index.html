<!DOCTYPE html>
<html>
<head>
    <title>GCP SQLite PoC</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #result { margin-top: 20px; font-size: 24px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>GCP + SQLite PoC</h1>
    <button onclick="fetchMessage()">Get Message from DB</button>
    <div id="result"></div>

    <script>
        function fetchMessage() {
            fetch('/get-data')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerText = data.message;
                });
        }
    </script>
</body>
</html>
